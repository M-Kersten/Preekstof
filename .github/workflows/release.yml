# What a church downloads, built from a tag or from the Actions tab.
#
#   git tag v0.11.0 && git push origin v0.11.0
#
# or Actions → release → Run workflow, with the version in the box. Both routes end in the
# same draft release; the second one exists because a tag cannot always be pushed from
# where the work happens, and because cutting a release should not need a terminal. Untick
# "publish" there to build and check the downloads without making a release of them.
#
# The number has to match backend/version.py either way. The number the app says out loud
# during a support call and the number on the download page being different is worse than
# either of them being wrong, so a mismatch fails the build rather than shipping.
#
# Four downloads, each unpacked and started the way a church would, through start.bat or
# start.command, before anything is published:
#
#   preekstof-<versie>.zip    the plain one: brings no Python, asks the computer for one
#   Preekstof-Windows.zip     with its own Python and the packages already in it
#   Preekstof-Mac.zip         the same, for a Mac with an Apple chip
#   Preekstof-Mac-Intel.zip   the same, for an older Mac; skipped when the packages have
#                             stopped making wheels for it
#
# The names of the last three never change, so the download page can link to
# releases/latest/download/<name> and the update button can find them.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.11.0)"
        required: true
        type: string
      publish:
        description: "Put the downloads in a draft release (untick to only build and check them)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plain:
    name: Gewone zip
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.which.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Which version this is, from the tag or from the box
        id: which
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            asked="${{ inputs.version }}"
          else
            asked="${GITHUB_REF_NAME#v}"
          fi
          said=$(python -c "import sys; sys.path.insert(0, '.'); from backend import version; print(version.VERSION)")
          echo "gevraagd: $asked   backend/version.py: $said"
          if [ "$asked" != "$said" ]; then
            echo "::error::De release zegt $asked en backend/version.py zegt $said."
            exit 1
          fi
          echo "VERSION=$asked" >> "$GITHUB_ENV"
          echo "version=$asked" >> "$GITHUB_OUTPUT"

      # The interface is committed so a church needs no Node, but a release must never ship
      # a build that is older than the code in the same zip.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: The committed interface must be the one this code builds
        run: git diff --exit-code frontend/dist

      - run: python -m tools.release --out dist --version "$VERSION"

      # A Python 3.12 of its own on the path first: start.command takes the newest it finds,
      # and the runner's system one cannot make a venv.
      - name: Run it the way a church would
        run: |
          set -eu
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          mkdir -p "$RUNNER_TEMP/kerk"
          unzip -q "dist/preekstof-$VERSION.zip" -d "$RUNNER_TEMP/kerk"
          python tools/check_bundle.py "$RUNNER_TEMP/kerk/preekstof-$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-plain
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Download voor Windows
    needs: plain
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.plain.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The embeddable Python from python.org: no installer, nothing in the registry, a
      # folder that runs where it is unpacked. It goes in as python/ next to the app.
      - name: A Python that travels with it
        run: |
          set -eu
          version=3.12.10
          curl -fsSL -o embed.zip \
            "https://www.python.org/ftp/python/${version}/python-${version}-embed-amd64.zip"
          mkdir -p python && unzip -q embed.zip -d python

          # A ._pth file replaces sys.path outright and puts Python in isolated mode, so
          # neither site-packages nor the folder the script lives in are on it. Written out
          # rather than patched, because both of those have to be added and what the file
          # said before does not matter.
          #
          #   pythonNNN.zip   the standard library, as it ships
          #   .               this folder, python/ inside the unpacked app
          #   ..              the app itself, which is what `import backend` needs
          #   import site     without this, pip has nowhere to install to
          short=$(echo "${version}" | cut -d. -f1,2 | tr -d .)
          printf 'python%s.zip\n.\n..\nimport site\n' "${short}" > "python/python${short}._pth"
          cat "python/python${short}._pth"

          # The embeddable build has no pip. It gets one here, on Windows, and keeps it: a
          # church's computer fetches what the download leaves out with it.
          curl -fsSL -o python/get-pip.py https://bootstrap.pypa.io/get-pip.py
          python/python.exe python/get-pip.py --no-warn-script-location

      - name: Everything installed into it, and zipped
        run: python -m tools.release --out dist --version "$VERSION" --bundle windows-x64 --python python

      # Unpacked the way Explorer's "Alles uitpakken" would, into a folder of its own.
      - name: Unpack
        shell: pwsh
        run: Expand-Archive -Path dist/Preekstof-Windows.zip -DestinationPath "$env:RUNNER_TEMP/kerk"

      - name: Run it the way a church would
        run: python tools/check_bundle.py "$RUNNER_TEMP/kerk/Preekstof"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-windows
          path: dist/Preekstof-Windows.zip
          if-no-files-found: error

  mac:
    name: Download voor de Mac (${{ matrix.kind }})
    needs: plain
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            kind: mac-arm64
            asset: Preekstof-Mac.zip
            optional: false
          - runner: macos-15-intel
            kind: mac-x64
            asset: Preekstof-Mac-Intel.zip
            optional: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    env:
      VERSION: ${{ needs.plain.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # python-build-standalone, by way of uv: a Python built to be moved to another folder
      # and run from there, which the one from python.org's installer is not. Links are
      # followed while copying, because the update unpacks with zipfile and knows no links.
      - name: A Python that travels with it
        run: |
          set -eu
          python -m pip install --quiet uv
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/pythons"
          uv python install 3.12
          prefix=""
          for found in "$UV_PYTHON_INSTALL_DIR"/cpython-3.12.*; do
            [ -L "$found" ] || prefix="$found"
          done
          echo "Python uit $prefix"
          cp -RL "$prefix" python
          rm -f python/lib/python3.12/EXTERNALLY-MANAGED
          python/bin/python3 -m pip --version || python/bin/python3 -m ensurepip
          python/bin/python3 -c "import sys, platform; print(sys.version, platform.machine())"

      - name: Everything installed into it, and zipped
        run: python -m tools.release --out dist --version "$VERSION" --bundle ${{ matrix.kind }} --python python

      # Unpacked with ditto, which is what Archive Utility does on a double-click, and
      # marked as downloaded the way Safari marks it. start.command has to clear that.
      - name: Run it the way a church would
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/kerk"
          ditto -x -k "dist/${{ matrix.asset }}" "$RUNNER_TEMP/kerk"
          mark="0081;$(printf %x "$(date +%s)");Safari;"
          find "$RUNNER_TEMP/kerk/Preekstof" -type f -exec xattr -w com.apple.quarantine "$mark" {} +
          xattr -p com.apple.quarantine "$RUNNER_TEMP/kerk/Preekstof/python/bin/python3"
          python tools/check_bundle.py "$RUNNER_TEMP/kerk/Preekstof"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.kind }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [plain, windows, mac]
    if: >-
      always() && needs.plain.result == 'success' && needs.windows.result == 'success'
      && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plain.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true

      # The Intel Mac may be missing; the rest may not.
      - name: Everything a church needs is there
        run: |
          set -eu
          ls -l dist
          for name in "preekstof-$VERSION.zip" Preekstof-Windows.zip Preekstof-Mac.zip; do
            [ -f "dist/$name" ] || { echo "::error::$name ontbreekt."; exit 1; }
          done

      - name: What a church downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          body_path: CHANGELOG.md
          draft: true
          fail_on_unmatched_files: true
