# Tag a commit and a church gets something to download.
#
#   git tag v0.9.1 && git push origin v0.9.1
#
# The tag has to match backend/version.py, because the number the app says out loud during a
# support call and the number on the download page being different is worse than either
# being wrong. The build below refuses the tag rather than shipping the mismatch.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag and the app must say the same number
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          said=$(python -c "import sys; sys.path.insert(0, '.'); from backend import version; print(version.VERSION)")
          echo "tag: $tagged   backend/version.py: $said"
          if [ "$tagged" != "$said" ]; then
            echo "::error::De tag zegt $tagged en backend/version.py zegt $said."
            exit 1
          fi

      # The interface is committed so a church needs no Node, but a release must never ship
      # a build that is older than the code in the same zip.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: The committed interface must be the one this code builds
        run: git diff --exit-code frontend/dist

      - run: python -m tools.release --out dist --version "${GITHUB_REF_NAME#v}"

      # A second zip for Windows, carrying its own Python. Without it a machine with no
      # Python asks winget for one and the volunteer has to click twice; with it, the first
      # double-click is the only one. Everything else in the zip is identical.
      #
      # NOT YET TESTED ON A REAL WINDOWS MACHINE. Until somebody has run this zip on a
      # Windows box with no Python on it, the plain zip above is the one to hand to a church.
      - name: A Python that travels with it
        run: |
          set -eu
          version=3.12.7
          curl -fsSL -o embed.zip \
            "https://www.python.org/ftp/python/${version}/python-${version}-embed-amd64.zip"
          mkdir -p winpython && unzip -q embed.zip -d winpython

          # A ._pth file replaces sys.path outright and puts Python in isolated mode, so
          # neither site-packages nor the folder the script lives in are on it. Written out
          # rather than patched, because both of those have to be added and what the file
          # said before does not matter.
          #
          #   pythonNNN.zip   the standard library, as it ships
          #   .               this folder, python/ inside the unpacked app
          #   ..              the app itself, which is what `import backend` needs
          #   import site     without this, pip has nowhere to install to
          short=$(echo "${version}" | cut -d. -f1,2 | tr -d .)
          printf 'python%s.zip\n.\n..\nimport site\n' "${short}" > "winpython/python${short}._pth"
          cat "winpython/python${short}._pth"

          # The embeddable build has no pip, and everything after this installs with pip.
          # It is bootstrapped on the church's own machine, by launcher.ensure_pip, because
          # this runner cannot execute a Windows binary to do it here.
          curl -fsSL -o winpython/get-pip.py https://bootstrap.pypa.io/get-pip.py

      - run: python -m tools.release --out dist --version "${GITHUB_REF_NAME#v}" --python winpython

      - name: What a church downloads
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.md
          draft: true
          fail_on_unmatched_files: true
